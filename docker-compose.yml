version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: kanso-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - kanso-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kanso-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/kanso
      - JWT_SECRET=${JWT_SECRET:-kanso_super_secret_jwt_key_please_change_in_production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - mongodb
    networks:
      - kanso-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: kanso-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - backend
    networks:
      - kanso-net

volumes:
  mongo-data:

networks:
  kanso-net:
    driver: bridge
