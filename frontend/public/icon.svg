<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#1e293b" stroke-width="8"/>

  <!-- Subtle inner glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Central Stylized L + Orbit Icon -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Orbit ring -->
    <circle cx="150" cy="150" r="120" fill="none" stroke="url(#primary)" stroke-width="16" stroke-dasharray="160 80" stroke-linecap="round"/>

    <!-- Core geometric 'L' & Check -->
    <path d="M 100 80 L 100 200 L 200 200" fill="none" stroke="url(#primary)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pulse Sparkle Point -->
    <circle cx="200" cy="100" r="14" fill="#38bdf8"/>
  </g>
</svg>
